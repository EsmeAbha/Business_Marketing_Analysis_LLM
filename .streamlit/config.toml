# Lucida's palette, handed to Streamlit's own theming engine.
#
# ui/theme.py restyles the chrome with CSS, but widgets Streamlit paints itself
# (sliders, checkboxes, the file-uploader drop zone, chart defaults) read these
# values instead. Setting both keeps the two in agreement.

[theme]
base = "light"
primaryColor = "#7B1E22"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAFA"
textColor = "#000000"

# Registering the faces here rather than relying only on the @import in
# ui/theme.py: this way Streamlit applies them to the widgets it paints
# internally, which CSS selectors don't reliably reach.
font = "Inter, system-ui, sans-serif"
headingFont = "Inter, system-ui, sans-serif"
codeFont = "ui-monospace, Cascadia Code, Menlo, monospace"

# Inter ships as a variable font — one file covers 100–900.
[[theme.fontFaces]]
family = "Inter"
url = "https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2"
weight = "100 900"
style = "normal"



[server]
headless = true

[browser]
gatherUsageStats = false
